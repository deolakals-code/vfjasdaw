name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install Pillow
      - name: Run tests (offline; the fetch tests use a local fake CDN)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m toramre --help
          python -m toramre doctor
          python -m toramre versions
          python -m toramre viewer --selftest
